      box-shadow: 0 20px 40px -12px rgba(255, 45, 85, 0.25);
    }

    .card img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .card:hover img {
      transform: scale(1.06);
    }

    .card-body {
      padding: 14px 16px 18px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    @keyframes spin {

    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      justify-content: center;
      align-items: center;
      z-index: 100;

  <header>

  <div class="container">
    <div id="loading" class="loading">

      Loading latest videos...
    </div>
    <div class="grid" id="video-grid" style="display:none;"></div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3 id="modal-title"></h3>
      <p>Click below to watch the full video</p>
      <a href="#" id="watch-now-btn" class="watch-btn" target="_blank" rel="noopener">

  <script>
    // ⬇️ এখানে আপনার WordPress সাইটের URL দিন (শেষে / দিবেন না)
    const WP_SITE_URL = 'https://your-wordpress-site.com';

    async function fetchVideos() {
      const loading = document.getElementById('loading');
      const grid = document.getElementById('video-grid');

      try {
        // Latest 100 posts (change per_page if needed)
        const response = await fetch(`${WP_SITE_URL}/wp-json/wp/v2/posts?_embed&per_page=50&orderby=date&order=desc`);
        
        if (!response.ok) throw new Error('Network response was not ok');
        
        const posts = await response.json();

        if (!posts.length) {
          loading.innerHTML = 'No videos found.';
          return;
        }

        posts.forEach(post => {
          const thumbnail = post._embedded?.['wp:featuredmedia']?.[0]?.source_url 
            || 'https://placehold.co/400x230/1e293b/94a3b8?text=No+Thumbnail';
          
          const title = post.title.rendered.replace(/&#(\d+);/g, (m, n) => String.fromCharCode(n));
          const link = post.link;
          const date = new Date(post.date).toLocaleDateString('en-IN', {
            day: 'numeric', month: 'short', year: 'numeric'
          });

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <img src="\( {thumbnail}" alt=" \){title}" loading="lazy">
            <div class="card-body">
              <div class="card-title">${title}</div>
              <div class="card-meta">
                <span class="badge">NEW</span>
                <span>${date}</span>
              </div>
            </div>
          `;
          card.onclick = () => openModal(title, link);
          grid.appendChild(card);
        });

        loading.style.display = 'none';
        grid.style.display = 'grid';

      } catch (err) {
        console.error(err);
        loading.innerHTML = `
          <div style="color:#ff6b8a;">
            Failed to load videos.<br>
            <small style="color:#94a3b8;">Check WP_SITE_URL or CORS settings.</small>
          </div>
        `;
      }
    }

    function openModal(title, link) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('watch-now-btn').href = link;
      document.getElementById('modal').style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
      document.body.style.overflow = '';
    }

    // Close modal on outside click
    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') closeModal();
    });

    // ESC key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // Start
    fetchVideos();
  </script>
