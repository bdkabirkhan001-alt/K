<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devar Ji 2024 Ullu Web Series All ep Xmaal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f1015;
      color: #ffffff;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 850px) {
      .container {
        grid-template-columns: 2.5fr 1fr;
      }
    }

    /* Main Player Section */
    .player-section {
      background: #181920;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .video-wrapper {
      position: relative;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000;
    }

    .video-wrapper video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      outline: none;
    }

    .video-info {
      padding: 20px;
    }

    .series-title {
      font-size: 22px;
      color: #e50914;
      margin-bottom: 5px;
    }

    .current-episode {
      font-size: 16px;
      color: #aaaaaa;
    }

    /* Episode List Section */
    .playlist-section {
      background: #181920;
      border-radius: 12px;
      padding: 15px;
      max-height: 600px;
      display: flex;
      flex-direction: column;
    }

    .playlist-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #2a2b36;
      color: #fff;
    }

    .episode-list {
      list-style: none;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Scrollbar style */
    .episode-list::-webkit-scrollbar {
      width: 6px;
    }
    .episode-list::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 10px;
    }

    .episode-item {
      padding: 12px 15px;
      background: #222430;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .episode-item:hover {
      background: #2e3142;
    }

    .episode-item.active {
      background: #e50914;
      color: #fff;
    }

    .episode-item .ep-num {
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Video Player -->
    <div class="player-section">
      <div class="video-wrapper">
        <video id="mainPlayer" controls autoplay poster="">
          <source id="videoSource" src="" type="video/mp4">
          Your browser does not support HTML5 video.
        </video>
      </div>
      <div class="video-info">
        <h1 class="series-title" id="seriesName">Web Series Name</h1>
        <p class="current-episode" id="epTitle">Select an Episode</p>
      </div>
    </div>

    <!-- Episode List -->
    <div class="playlist-section">
      <div class="playlist-title">All Episodes</div>
      <ul class="episode-list" id="episodeContainer"></ul>
    </div>
  </div>

  <script>
    // 1. Series details r Episode Link-gulo ekhane add koro
    const seriesData = {
      title: "Devar Ji 2024",
      episodes: [
        { ep: 1, name: "Episode 1", url: "https://cdn.azmaal.com/ULLU/Devar%20Ji/Devar%20Ji%20Episode%201.mp4" },
        { ep: 2, name: "Episode 2", url: "https://cdn.azmaal.com/ULLU/Devar%20Ji/Devar%20Ji%20Episode%202.mp4" },
        { ep: 3, name: "Episode 3", url: "https://cdn.azmaal.com/ULLU/Devar%20Ji/Devar%20Ji%20Episode%203.mp4" },
        { ep: 4, name: "Episode 4", url: "https://cdn.azmaal.com/ULLU/Devar%20Ji/Devar%20Ji%20Episode%204.mp4" },
        { ep: 5, name: "Episode 5", url: "https://cdn.azmaal.com/ULLU/Devar%20Ji/Devar%20Ji%20Episode%205.mp4" },
        { ep: 6, name: "Episode 6", url: "https://cdn.azmaal.com/ULLU/Devar%20Ji/Devar%20Ji%20Episode%206.mp4" },
        { ep: 7, name: "Episode 7", url: "https://cdn.azmaal.com/ULLU/Devar%20Ji/Devar%20Ji%20Episode%207.mp4" },
        { ep: 8, name: "Episode 8", url: "https://cdn.azmaal.com/ULLU/Devar%20Ji/Devar%20Ji%20Episode%208.mp4" },
        // Ekhane ichhamoto aro episode add korte paro:
        // { ep: 5, name: "Episode 5", url: "YOUR_MP4_LINK_HERE" },
      ]
    };

    // DOM Elements
    const player = document.getElementById('mainPlayer');
    const source = document.getElementById('videoSource');
    const seriesName = document.getElementById('seriesName');
    const epTitle = document.getElementById('epTitle');
    const episodeContainer = document.getElementById('episodeContainer');

    // Load Series Title
    seriesName.innerText = seriesData.title;

    // Generate Episode List
    function renderEpisodes() {
      episodeContainer.innerHTML = "";
      
      seriesData.episodes.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = `episode-item ${index === 0 ? 'active' : ''}`;
        li.innerHTML = `<span class="ep-num">Episode ${item.ep}</span> <span>${item.name}</span>`;
        
        li.onclick = () => playEpisode(index, li);
        episodeContainer.appendChild(li);
      });

      // Play First Episode on Load
      if (seriesData.episodes.length > 0) {
        loadVideo(0);
      }
    }

    // Play Selected Episode
    function playEpisode(index, element) {
      document.querySelectorAll('.episode-item').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      loadVideo(index);
    }

    function loadVideo(index) {
      const selectedEp = seriesData.episodes[index];
      source.src = selectedEp.url;
      epTitle.innerText = `Playing: Episode ${selectedEp.ep} - ${selectedEp.name}`;
      player.load();
      player.play();
    }

    // Initialize
    renderEpisodes();
  </script>

</body>
</html>
