<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hindi Hot Web Series</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f0f0f; color: #fff; }
    
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 24px; background-color: #0f0f0f; position: sticky;
      top: 0; z-index: 100; border-bottom: 1px solid #272727;
    }
    .logo { font-size: 20px; font-weight: bold; color: #ff0000; }
    .search-bar { width: 40%; display: flex; }
    .search-bar input {
      width: 100%; padding: 8px 16px; background-color: #121212;
      border: 1px solid #303030; border-radius: 20px 0 0 20px; color: #fff; outline: none;
    }
    .search-bar button {
      padding: 8px 18px; background-color: #222222; border: 1px solid #303030;
      border-left: none; border-radius: 0 20px 20px 0; color: #fff; cursor: pointer;
    }

    .container { padding: 24px; }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .video-card {
      background-color: #181818; border-radius: 12px; overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease; cursor: pointer;
      text-decoration: none; color: inherit; display: block;
    }
    .video-card:hover { transform: translateY(-4px); box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    
    .thumbnail-container { position: relative; width: 100%; padding-top: 56.25%; background-color: #000; }
    .thumbnail-container img {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
    }
    .ott-badge {
      position: absolute; bottom: 8px; right: 8px; background-color: rgba(255, 0, 0, 0.85);
      color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: bold; text-transform: uppercase;
    }

    .video-info { padding: 12px; }
    .video-title { font-size: 15px; font-weight: 600; line-height: 1.3; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .video-meta { font-size: 13px; color: #aaa; }
  </style>
</head>
<body>

  <header>
    <div class="logo">▶ Hindi Hot Web Series</div>
    <div class="search-bar">
      <input type="text" placeholder="Search series...">
      <button>🔍</button>
    </div>
  </header>

  <div class="container">
    <div class="video-grid" id="videoContainer"></div>
  </div>

  <script>
    const container = document.getElementById('videoContainer');

    // External JSON File Load (Fetch API)
    // JSON ফাইল অন্য কোনো সার্ভার/লিঙ্কে থাকলে 'data.json' এর জায়গায় পুরো URL (যেমন: https://example.com/api.json) দিন
    fetch('data.json')
      .then(response => response.json())
      .then(videoData => {
        videoData.forEach(item => {
          const card = document.createElement('a');
          card.className = 'video-card';
          card.href = item.videoUrl;
          card.target = '_blank';

          card.innerHTML = `
            <div class="thumbnail-container">
              <img src="${item.thumbnail}" alt="${item.title}">
              <span class="ott-badge">${item.ott}</span>
            </div>
            <div class="video-info">
              <div class="video-title">${item.title}</div>
              <div class="video-meta">Platform: ${item.ott}</div>
            </div>
          `;

          container.appendChild(card);
        });
      })
      .catch(error => console.error('JSON Load Error:', error));
  </script>

</body>
</html>
