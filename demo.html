<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Hotlink / Referrer block bypass korar jonno -->
    <meta name="referrer" content="no-referrer">
    <title>HLS Video Player</title>
    <!-- HLS.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .player-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            width: 100%;
            max-width: 850px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .video-container {
            position: relative;
            width: 100%;
            background-color: #000;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
            outline: none;
        }
        .info-panel {
            padding: 16px 20px;
        }
        .title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #58a6ff;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="video-container">
            <video id="video" controls preload="auto"></video>
        </div>
        <div class="info-panel">
            <h1 class="title">Brazzers Bigger And Better - The Best Of Big Naturals Vol 2</h1>
        </div>
    </div>

    <script>
        var video = document.getElementById('video');
        var videoSrc = 'https://player2.cdnlivestream.xyz/videos/Brazzers-Bigger-And-Better-The-Best-Of-Big-Naturals-Vol-2/video.m3u8';

        if (Hls.isSupported()) {
            var hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
        }
        // Native HLS support (Safari browser-er jonno)
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
        }
    </script>

</body>
</html>
