<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .player-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            width: 100%;
            max-width: 850px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .video-container {
            position: relative;
            width: 100%;
            background-color: #000;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
            outline: none;
        }
        .info-panel {
            padding: 16px 20px;
        }
        .title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #58a6ff;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="video-container">
            <video controls preload="metadata" poster="">
                <source src="https://files.klubnichka-hd.com/newvideofile3/october26_2/Brazzers%20Exxtra%20-%20Martina%20Smeraldi%20%26%20Alanna%20Pow%20-%20Fiending%20For%20A%20Threesome.mp4" type="video/mp4">
                Apnar browser video tag support kore na.
            </video>
        </div>
        <div class="info-panel">
            <h1 class="title">Brazzers Exxtra - Martina Smeraldi & Alanna Pow - Fiending For A Threesome</h1>
        </div>
    </div>

</body>
</html>
