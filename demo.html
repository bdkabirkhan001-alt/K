<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeonX Code Generator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #080810; color: #fff; min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: center; }

    .generator-card {
      width: 100%;
      max-width: 700px;
      background-color: #0f111e;
      border-radius: 12px;
      padding: 24px;
      border: 1px solid #1e2238;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.15);
    }

    h2 {
      font-size: 22px;
      margin-bottom: 20px;
      text-align: center;
      background: linear-gradient(45deg, #ff007f, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #aaa; }
    
    input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      background-color: #121422;
      border: 1px solid #232742;
      border-radius: 8px;
      color: #fff;
      outline: none;
    }
    input[type="text"]:focus { border-color: #00f2fe; }

    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(45deg, #ff007f, #00f2fe);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      margin-top: 10px;
    }

    .output-group { margin-top: 24px; display: none; }
    
    textarea {
      width: 100%;
      height: 220px;
      background-color: #05060a;
      border: 1px solid #232742;
      border-radius: 8px;
      color: #00f2fe;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      resize: none;
      outline: none;
    }

    .copy-btn {
      background-color: #1a1c2e;
      border: 1px solid #00f2fe;
      color: #00f2fe;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 8px;
      float: right;
    }
  </style>
</head>
<body>

  <div class="generator-card">
    <h2>NeonX HTML Code Generator</h2>
    
    <div class="form-group">
      <label for="videoTitle">Video Title:</label>
      <input type="text" id="videoTitle" placeholder="যেমন: Hindi Hot Web Series Episode 1">
    </div>

    <div class="form-group">
      <label for="videoLink">Video Link (MP4):</label>
      <input type="text" id="videoLink" placeholder="যেমন: https://example.com/video.mp4">
    </div>

    <button class="btn" onclick="generateCode()">Generate HTML Code</button>

    <div class="output-group" id="outputGroup">
      <label>Generated Code:</label>
      <textarea id="codeOutput" readonly></textarea>
      <button class="copy-btn" onclick="copyCode()" id="copyBtn">Copy Code</button>
    </div>
  </div>

  <script>
    function generateCode() {
      const title = document.getElementById('videoTitle').value.trim();
      const link = document.getElementById('videoLink').value.trim();

      if (!title || !link) {
        alert("দয়া করে Title এবং Video Link দুটোই দিন!");
        return;
      }

      // Template HTML Generation
      const generatedHtml = `<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${title}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #080810; color: #fff; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 16px; }
    .player-card { width: 100%; max-width: 900px; background-color: #0f111e; border-radius: 12px; overflow: hidden; border: 1px solid #1e2238; box-shadow: 0 0 25px rgba(0, 242, 254, 0.15); }
    .video-wrapper { position: relative; width: 100%; padding-top: 56.25%; background-color: #000; }
    .video-wrapper video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; outline: none; }
    .video-details { padding: 20px; }
    .video-title { font-size: 20px; font-weight: 700; color: #fff; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="player-card">
    <div class="video-wrapper">
      <video controls autoplay playsinline src="${link}"></video>
    </div>
    <div class="video-details">
      <h1 class="video-title">${title}</h1>
    </div>
  </div>
</body>
</html>`;

      document.getElementById('codeOutput').value = generatedHtml;
      document.getElementById('outputGroup').style.display = 'block';
    }

    function copyCode() {
      const codeOutput = document.getElementById('codeOutput');
      codeOutput.select();
      document.execCommand('copy');
      
      const copyBtn = document.getElementById('copyBtn');
      copyBtn.innerText = "Copied!";
      setTimeout(() => { copyBtn.innerText = "Copy Code"; }, 2000);
    }
  </script>

</body>
</html>
