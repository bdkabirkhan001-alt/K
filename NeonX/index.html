<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hindi Hot Web Series - NeonX</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #080810; color: #fff; }

    /* NeonX Header */
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 24px; background-color: #0d0e17; position: sticky;
      top: 0; z-index: 100; border-bottom: 1px solid #1a1c2e;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.05);
    }
    .logo {
      font-size: 22px; font-weight: 800; text-transform: uppercase;
      background: linear-gradient(45deg, #ff007f, #00f2fe);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
    }
    .search-bar { width: 40%; display: flex; }
    .search-bar input {
      width: 100%; padding: 8px 16px; background-color: #121422;
      border: 1px solid #232742; border-radius: 20px 0 0 20px; color: #fff; outline: none;
    }
    .search-bar input:focus { border-color: #00f2fe; }
    .search-bar button {
      padding: 8px 18px; background-color: #1a1c2e; border: 1px solid #232742;
      border-left: none; border-radius: 0 20px 20px 0; color: #00f2fe; cursor: pointer;
    }

    /* Grid Layout */
    .container { padding: 24px; }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    /* Neon Card Design */
    .video-card {
      background-color: #0f111e; border-radius: 12px; overflow: hidden;
      border: 1px solid #1e2238; transition: all 0.3s ease;
      text-decoration: none; color: inherit; display: block;
    }
    .video-card:hover {
      transform: translateY(-5px);
      border-color: #ff007f;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
    }

    .thumbnail-container { position: relative; width: 100%; padding-top: 56.25%; background-color: #000; }
    .thumbnail-container img {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
    }

    .video-info { padding: 14px; }
    .video-title {
      font-size: 15px; font-weight: 600; line-height: 1.4; color: #e0e0e0;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .video-card:hover .video-title { color: #00f2fe; }
  </style>
</head>
<body>

  <header>
    <div class="logo">NeonX</div>
    <div class="search-bar">
      <input type="text" placeholder="Search series...">
      <button>🔍</button>
    </div>
  </header>

  <div class="container">
    <div class="video-grid" id="videoContainer"></div>
  </div>

  <script>
    const container = document.getElementById('videoContainer');

    // Fetching external JSON file
    fetch('data.json')
      .then(response => response.json())
      .then(videoData => {
        videoData.forEach(item => {
          const card = document.createElement('a');
          card.className = 'video-card';
          card.href = item.link;
          card.target = '_blank';

          card.innerHTML = `
            <div class="thumbnail-container">
              <img src="${item.thumbnail}" alt="${item.title}">
            </div>
            <div class="video-info">
              <div class="video-title">${item.title}</div>
            </div>
          `;

          container.appendChild(card);
        });
      })
      .catch(error => console.error('Error loading JSON:', error));
  </script>

</body>
</html>
